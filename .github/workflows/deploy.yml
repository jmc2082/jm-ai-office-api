name: Deploy API

# Tests, builds the image (linux/amd64) and pushes it to ECR, uploads infra/host to S3,
# then runs the jm-office-deploy SSM command on the box. Re-run it by hand
# (Actions > Deploy API > Run workflow) after the instance is replaced.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored AWS keys

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  STACK: jm-office-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          {
            echo "repo_uri=$(out ApiRepositoryUri)"
            echo "bucket=$(out BucketName)"
            echo "instance=$(out InstanceId)"
            echo "document=$(out DeployDocumentName)"
            echo "api_url=$(out ApiUrl)"
          } >> "$GITHUB_OUTPUT"

      - name: Check for an existing image
        id: image
        # Tags are immutable, so a re-run for the same commit reuses the image.
        run: |
          repo_name="${REPO_URI#*/}"
          if aws ecr describe-images --repository-name "$repo_name" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO_URI: ${{ steps.stack.outputs.repo_uri }}

      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.image.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.exists == 'false'

      - uses: docker/build-push-action@v6
        if: steps.image.outputs.exists == 'false'
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.stack.outputs.repo_uri }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload release bundle
        run: aws s3 cp --recursive --only-show-errors infra/host "s3://${{ steps.stack.outputs.bucket }}/releases/$TAG/"

      - name: Run deploy on the box
        env:
          INSTANCE: ${{ steps.stack.outputs.instance }}
          DOCUMENT: ${{ steps.stack.outputs.document }}
        run: |
          id=$(aws ssm send-command --document-name "$DOCUMENT" --instance-ids "$INSTANCE" \
            --parameters "ReleaseTag=$TAG" --comment "deploy $TAG" --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 5 "${{ steps.stack.outputs.api_url }}/health"
