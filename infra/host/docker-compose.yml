# Runs on the EC2 box. deploy.sh writes a .env next to this file with
# API_IMAGE, API_DOMAIN, BUCKET and AWS_REGION, then runs `docker compose up -d`.
# The project name is fixed, so each release replaces the previous one's containers.
name: jm-office

x-litestream: &litestream
  image: litestream/litestream:0.3.13
  # Same uid as the `node` user in the API image, so both can write the database.
  user: "1000:1000"
  environment:
    BUCKET: ${BUCKET}
    AWS_REGION: ${AWS_REGION}
  volumes:
    - /opt/jm-office/data:/data
    - ./litestream.yml:/etc/litestream.yml:ro

services:
  # One-shot: on a new box, pull the latest database from S3 before the API starts.
  restore:
    <<: *litestream
    command: ["restore", "-config", "/etc/litestream.yml", "-if-db-not-exists", "-if-replica-exists", "/data/office.db"]
    restart: "no"

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: /opt/jm-office/shared/app.env
    volumes:
      - /opt/jm-office/data:/data
    depends_on:
      restore:
        condition: service_completed_successfully

  litestream:
    <<: *litestream
    command: ["replicate", "-config", "/etc/litestream.yml"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  # Certificates live here; keeping them across releases avoids Let's Encrypt rate limits.
  caddy_data:
  caddy_config:
